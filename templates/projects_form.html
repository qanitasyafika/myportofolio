{% extends "base.html" %}

{% block meta %}
<title>Add Project - {{ name }}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="section">
        <div class="container">
            <h1>Add New Projects</h1>
            <form method="post" action="{% url 'main:create_project' %}" class="project-form">
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-group" style="margin-bottom: 1.25rem;">
                        <label for="{{ field.id_for_label }}" style="display: block; font-weight: 700; margin-bottom: 0.4rem;">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% for error in field.errors %}
                            <p class="form-error" style="color: #b42318; font-size: 0.85rem;">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary">Tambah Project</button>
                <a href="{% url 'main:show_projects' %}" class="btn btn-navy-outline">Batal</a>
            </form>
        </div>
    </section>
</main>
{% endblock content %}
