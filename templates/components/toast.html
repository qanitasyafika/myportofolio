<!-- Toast Notification Container -->
<div id="toast-container" style="position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.75rem; max-width: 360px; width: 100%; pointer-events: none;">
</div>

<script>
  // Fungsi global untuk menampilkan Toast
  function showToast(title, message, type = 'success', duration = 4000) {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    toast.style.pointerEvents = 'auto';
    toast.style.padding = '1rem 1.25rem';
    toast.style.borderRadius = '8px';
    toast.style.boxShadow = '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)';
    toast.style.display = 'flex';
    toast.style.flexDirection = 'column';
    toast.style.gap = '0.25rem';
    toast.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(1rem)';

    if (type === 'success') {
      toast.style.backgroundColor = '#f0fdf4';
      toast.style.borderLeft = '4px solid #16a34a';
      toast.style.color = '#166534';
    } else if (type === 'error') {
      toast.style.backgroundColor = '#fef2f2';
      toast.style.borderLeft = '4px solid #dc2626';
      toast.style.color = '#991b1b';
    } else {
      toast.style.backgroundColor = '#f0f9ff';
      toast.style.borderLeft = '4px solid #0284c7';
      toast.style.color = '#075985';
    }

    toast.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <strong style="font-size: 0.95rem; font-weight: 700;">${title}</strong>
        <button type="button" onclick="this.parentElement.parentElement.remove()" style="background: none; border: none; font-size: 1.1rem; cursor: pointer; color: inherit; opacity: 0.7; line-height: 1;">&times;</button>
      </div>
      <p style="margin: 0; font-size: 0.875rem; opacity: 0.9;">${message}</p>
    `;

    container.appendChild(toast);

    // Animasi muncul
    requestAnimationFrame(() => {
      toast.style.opacity = '1';
      toast.style.transform = 'translateY(0)';
    });

    // Hilang otomatis sesuai durasi
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(1rem)';
      setTimeout(() => {
        toast.remove();
      }, 300);
    }, duration);
  }
</script>
