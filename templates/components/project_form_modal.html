<!-- Modal Form Tambah Proyek via Popover API -->
<div id="add-project-modal" popover style="padding: 0; border: none; border-radius: 12px; max-width: 520px; width: 90%; background: #ffffff; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);">
  <div style="padding: 1.5rem; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;">
    <h3 style="margin: 0; font-size: 1.25rem; font-weight: 700; color: #111827;">Tambah Proyek Baru (AJAX)</h3>
    <button type="button" onclick="document.getElementById('add-project-modal').hidePopover()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #6b7280; line-height: 1;">&times;</button>
  </div>
  
  <form id="project-form" style="padding: 1.5rem;">
    {% csrf_token %}
    <div style="display: flex; flex-direction: column; gap: 1rem;">
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}" style="display: block; font-weight: 700; margin-bottom: 0.35rem; color: #374151;">
            {{ field.label }}
          </label>
          {{ field }}
        </div>
      {% endfor %}
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
      <button type="button" onclick="document.getElementById('add-project-modal').hidePopover()" class="btn btn-navy-outline">Batal</button>
      <button type="submit" class="btn btn-primary">Simpan Proyek</button>
    </div>
  </form>
</div>
