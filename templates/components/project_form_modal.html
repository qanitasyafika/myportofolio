<div id="add-project-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-project-modal-title">
  
  <button type="button"
          class="project-form-modal_backdrop"
          popovertarget="add-project-modal"
          popovertargetaction="hide"
          aria-label="Tutup form tambah proyek"></button>

  <div class="project-form-modal_content">
    <button type="button"
            class="project-form-modal_close"
            popovertarget="add-project-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah proyek">×</button>
    
    <h2 id="add-project-modal-title">Tambah Proyek Baru</h2>
    
    <form id="project-form" class="auth-form">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}
            <p class="form-error">{{ error }}</p>
          {% endfor %}
        </div>
      {% endfor %}
      
      <div class="project-form-modal_actions">
        <button type="button"
                class="btn btn-navy-outline"
                popovertarget="add-project-modal"
                popovertargetaction="hide">Batal</button>
        <button type="submit" class="btn btn-navy-submit">Tambah Proyek</button>
      </div>
    </form>
  </div>
</div>
